services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: intern-webcare-app:latest
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "true"
      CACHE_CONFIG: "true"
      CACHE_ROUTES: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - intern-webcare
    cpus: "1.00"
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: intern-webcare-nginx:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
      - app_cache:/var/www/html/bootstrap/cache:ro
    networks:
      - intern-webcare
    cpus: "0.50"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  queue:
    image: intern-webcare-app:latest
    pull_policy: never
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - intern-webcare
    cpus: "0.50"
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    stop_grace_period: 60s

  scheduler:
    image: intern-webcare-app:latest
    pull_policy: never
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - intern-webcare
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 96

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-intern_webcare}
      MYSQL_USER: ${DB_USERNAME:-intern_webcare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - intern-webcare
    cpus: "1.00"
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - intern-webcare
    cpus: "0.25"
    mem_limit: 192m
    mem_reservation: 96m
    pids_limit: 96
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  app_cache:
  mysql_data:
  redis_data:

networks:
  intern-webcare:
    driver: bridge
